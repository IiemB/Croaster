; ============================================================================
; Croaster — reference firmware example
; ----------------------------------------------------------------------------
; This folder is a standalone PlatformIO project that consumes the Croaster
; library from the repository root (see the `../..` lib_dep below), exactly as
; an external project would. It implements the default 128x64 SSD1306 OLED
; display for the ESP8266 (NodeMCU) and ESP32-C3 Super Mini reference boards.
;
;   cd examples/reference
;   pio run -e esp32c3 -t upload
;   pio run -e esp8266 -t upload
; ============================================================================

[env]
lib_deps =
	../..
	https://github.com/Links2004/arduinoWebSockets.git
	bblanchon/ArduinoJson@^7.4.3
	adafruit/Adafruit SSD1306@^2.5.17
	yuriisalimov/MAX6675_Thermocouple@^2.0.2
	tzapu/WiFiManager@^2.0.17

[env:esp32c3]
board = esp32-c3-devkitm-1
framework = arduino
platform = espressif32
lib_extra_dirs = ~/Documents/Arduino/libraries
upload_speed = 921600
monitor_speed = 115200
board_build.partitions = ../../custom32c3sm.csv
build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
lib_extra_dirs = ~/Documents/Arduino/libraries
monitor_speed = 115200
upload_speed = 115200
