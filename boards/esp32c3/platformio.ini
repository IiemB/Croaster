; ============================================================================
; Croaster — ESP32-C3 Super Mini implementation
; ----------------------------------------------------------------------------
; This folder is a standalone PlatformIO project that consumes the Croaster
; library from `croaster/` (see the `../../croaster` lib_dep below), plus the
; shared SSD1306 display from `../common`, exactly as an external project would.
; It implements the 128x64 SSD1306 OLED display for the ESP32-C3 Super Mini.
; Board-specific config (pins, dummy mode, LED) lives in src/config.h.
;
;   cd boards/esp32c3
;   pio run -e esp32c3 -t upload
;
; Want another board? Create a new boards/<board>/ folder like this one.
; ============================================================================

[env]
lib_deps =
	Croaster=symlink://../../croaster
	CroasterDisplaySSD1306=symlink://../common
	links2004/WebSockets@^2.7.3
	bblanchon/ArduinoJson@^7.4.3
	adafruit/Adafruit SSD1306@^2.5.17
	yuriisalimov/MAX6675_Thermocouple@^2.0.2
	tzapu/WiFiManager@^2.0.17

[env:esp32c3]
board = esp32-c3-devkitm-1
framework = arduino
platform = espressif32
build_type = release
; 460800 is the board's default — 921600 over the C3's native USB is flaky and
; intermittently fails esptool's sync with "No serial data received".
upload_speed = 460800
; Reset into the ROM bootloader via the 1200bps USB touch. The running
; TinyUSB CDC (ARDUINO_USB_MODE=1) holds the USB-Serial-JTAG, so esptool's
; default_reset alone is unreliable for re-flashing.
board_upload.use_1200bps_touch = yes
monitor_speed = 115200
board_build.partitions = custom32c3sm.csv
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DLED_ON=LOW

; Debug variant (uploaded via ./upload_monitor.sh) — same config, unoptimised + symbols.
[env:esp32c3-debug]
extends = env:esp32c3
build_type = debug
