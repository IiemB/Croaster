; ============================================================================
; Croaster — ESP8266 (NodeMCU / ESP-12E) implementation
; ----------------------------------------------------------------------------
; Standalone PlatformIO project that consumes the Croaster library from
; `croaster/` (`../../croaster`) plus the shared SSD1306 display
; (`../common`). Board config (pins, dummy mode, LED) lives in src/config.h.
;
;   cd boards/esp8266
;   pio run -e esp8266 -t upload
; ============================================================================

[env]
lib_deps =
	../../croaster
	../common
	https://github.com/Links2004/arduinoWebSockets.git
	bblanchon/ArduinoJson@^7.4.3
	adafruit/Adafruit SSD1306@^2.5.17
	yuriisalimov/MAX6675_Thermocouple@^2.0.2
	tzapu/WiFiManager@^2.0.17

[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
build_type = release
monitor_speed = 115200
upload_speed = 115200

; Debug variant (uploaded via ./upload.sh) — same config, unoptimised + symbols.
[env:esp8266-debug]
extends = env:esp8266
build_type = debug
