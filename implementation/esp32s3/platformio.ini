; ============================================================================
; Croaster — ESP32-S3 2.8" ILI9341 LCD implementation (board: ES3C28P)
; ----------------------------------------------------------------------------
; This folder is a standalone PlatformIO project that consumes the Croaster
; library from the repository root (see the `../..` lib_dep below), exactly as
; an external project would. It implements the LVGL UI on the built-in
; ILI9341 IPS LCD for the ES3C28P (ESP32-S3) board.
;
; Board-specific config lives HERE (never in the library):
;   - thermocouple pins / dummy mode / LED   -> src/config.h
;   - LCD + touch pin layout                 -> src/pins.h
;   - LVGL UI (LvglUi.*) + touch (LvglTouch.*) + lv_conf.h -> src/ui/
;   - ESP-IDF Kconfig overrides              -> esp32s3-sdkconfig.defaults
;
;   cd implementation/esp32s3
;   pio run -e esp32s3 -t upload
;
; Board: ES3C28P (2.8" ESP32-S3 LCD Display, lcdwiki)
;   Display: ILI9341V 240x320 SPI
;   Touch: FT6336G capacitive I2C
; ============================================================================

[env]
lib_deps =
	../..
	https://github.com/Links2004/arduinoWebSockets.git
	bblanchon/ArduinoJson@^7.4.3
	adafruit/Adafruit ILI9341@^1.6.3
	yuriisalimov/MAX6675_Thermocouple@^2.0.2
	tzapu/WiFiManager@^2.0.17
	lvgl/lvgl@^9.5.0

[env:esp32s3]
board = esp32-s3-devkitc-1
framework = arduino
platform = espressif32
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; 16 MB flash / OPI PSRAM (AP_3v3 = OPI PSRAM with DIO flash)
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = dio_opi

; ESP-IDF Kconfig overrides — mbedTLS / NimBLE fixes (see the sdkconfig file).
; These are real Kconfig options, not preprocessor defines.
board_build.sdkconfig_path = esp32s3-sdkconfig.defaults

build_flags =
	; Board id reported via getDeviceInfo "board" (matches the app's
	; CroasterBoardTypes). Each implementation defines its own.
	-DCROASTER_BOARD_NAME=\"esp32s3\"
	; Point LVGL directly at this implementation's lv_conf.h (bypasses the
	; buggy __has_include() auto-detection on GCC 8.4)
	-DLV_CONF_PATH="\"${PROJECT_DIR}/src/ui/lv_conf.h\""
	; Include paths: src/ for pins.h + src/ui/ for the LVGL layer
	-Isrc
	-Isrc/ui
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	; Suppress deprecation warning from ArduinoWebsockets (server.available()
	; renamed to accept() in newer Arduino Network API — not our code to fix)
	-Wno-deprecated-declarations
